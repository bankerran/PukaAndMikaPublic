<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive SVG Squares Demo</title>
  <style>
    /* Reset & layout */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Base styling for all squares (hidden until active) */
    .square {
      position: absolute;
      left: 0;
      width: 100vw;
      display: none; /* toggled via JS */
    }

    /* Position & color each 1/3‑height band */
    #top_third    { top: 0;          height: 33.333vh; background-color: #d0eaff; }
    #middle_third { top: 33.333vh;   height: 33.333vh; background-color: #dfffe0; }
    #bottom_third { top: 66.666vh;   height: 33.333vh; background-color: #fff2cc; }
    #full         { top: 0;          height: 100vh;    background-color: #f9d0ff; }

    /* SVG layout — fill container & scale text */
    svg {
      width: 100%;
      height: 100%;
    }
    svg text {
      fill: #333;
      dominant-baseline: middle;
      text-anchor: middle;
      font-size: 10; /* scaled by viewBox */
      font-weight: bold;
    }

    /* Next button styling */
    #nextBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>
  <!-- SVG Squares -->
  <div id="top_third" class="square">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="transparent" stroke="black" stroke-width="1" />
      <text x="50" y="50">Top Third</text>
    </svg>
  </div>

  <div id="middle_third" class="square">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="transparent" stroke="black" stroke-width="1" />
      <text x="50" y="50">Middle Third</text>
    </svg>
  </div>

  <div id="bottom_third" class="square">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="transparent" stroke="black" stroke-width="1" />
      <text x="50" y="50">Bottom Third</text>
    </svg>
  </div>

  <div id="full" class="square">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="transparent" stroke="black" stroke-width="1" />
      <text x="50" y="50">Full</text>
    </svg>
  </div>

  <!-- Next Button -->
  <button id="nextBtn" aria-label="Show next square">Next ▶</button>

  <script>
    (function() {
      const squareIds = ["top_third", "middle_third", "bottom_third", "full"];
      let current = 0;

      function showSquare(index) {
        squareIds.forEach((id, i) => {
          const el = document.getElementById(id);
          el.style.display = i === index ? "block" : "none";
        });
      }

      // Initial render
      showSquare(current);

      document.getElementById("nextBtn").addEventListener("click", () => {
        current = (current + 1) % squareIds.length;
        showSquare(current);
      });
    })();
  </script>
</body>
</html>
